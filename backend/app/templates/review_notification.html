<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简历审核通知</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Microsoft YaHei', Arial, sans-serif; background-color: #f3f4f6; color: #333333;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#f3f4f6" style="width: 100%; background-color: #f3f4f6; border-collapse: collapse;">
        <tr>
            <td align="center" style="padding: 32px 12px;">
                <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" bgcolor="#ffffff" style="width: 100%; max-width: 600px; background-color: #ffffff; border-collapse: collapse;">
                    <tr>
                        <td align="center" bgcolor="#1677ff" style="padding: 28px 32px; background-color: #1677ff; color: #ffffff; font-size: 24px; line-height: 32px; font-weight: 700;">
                            简历审核通知
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 32px; color: #333333; font-size: 16px; line-height: 26px;">
                            <p style="margin: 0 0 18px; color: #333333; font-size: 16px; line-height: 26px;">
                                尊敬的 <strong>{{ reviewer_name }}</strong>，
                            </p>
                            <p style="margin: 0 0 24px; color: #333333; font-size: 16px; line-height: 26px;">
                                有一份新的简历需要您进行审核：
                            </p>

                            <table role="presentation" data-section="review-details-table" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#f8f9fa" style="width: 100%; background-color: #f8f9fa; border-collapse: collapse; border-left: 4px solid #1677ff;">
                                <tr>
                                    <td style="padding: 20px 24px;">
                                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width: 100%; border-collapse: collapse;">
                                            <tr>
                                                <td width="104" valign="top" style="width: 104px; padding: 7px 0; color: #667085; font-size: 14px; line-height: 22px;">候选人</td>
                                                <td valign="top" style="padding: 7px 0; color: #202124; font-size: 14px; line-height: 22px; font-weight: 700;">{{ candidate_name }}</td>
                                            </tr>
                                            <tr>
                                                <td width="104" valign="top" style="width: 104px; padding: 7px 0; color: #667085; font-size: 14px; line-height: 22px;">应聘岗位</td>
                                                <td valign="top" style="padding: 7px 0; color: #202124; font-size: 14px; line-height: 22px; font-weight: 700;">{{ position_title }}</td>
                                            </tr>
                                            <tr>
                                                <td width="104" valign="top" style="width: 104px; padding: 7px 0; color: #667085; font-size: 14px; line-height: 22px;">匹配度评分</td>
                                                <td valign="top" style="padding: 7px 0; color: #202124; font-size: 14px; line-height: 22px; font-weight: 700;">{{ match_score }} 分</td>
                                            </tr>
                                            <tr>
                                                <td width="104" valign="top" style="width: 104px; padding: 7px 0; color: #667085; font-size: 14px; line-height: 22px;">提交时间</td>
                                                <td valign="top" style="padding: 7px 0; color: #202124; font-size: 14px; line-height: 22px;">{{ submitted_at }}</td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>

                            {% if hr_review %}
                            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#fff8db" style="width: 100%; margin-top: 20px; background-color: #fff8db; border-collapse: collapse; border: 1px solid #f5d36a;">
                                <tr>
                                    <td style="padding: 16px 18px; color: #725600; font-size: 14px; line-height: 22px;">
                                        <p style="margin: 0 0 8px; color: #725600; font-size: 14px; line-height: 22px; font-weight: 700;">HR 评语</p>
                                        <p style="margin: 0; color: #5f6368; font-size: 14px; line-height: 22px; white-space: pre-wrap;">{{ hr_review }}</p>
                                    </td>
                                </tr>
                            </table>
                            {% endif %}

                            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width: 100%; border-collapse: collapse;">
                                <tr>
                                    <td align="center" style="padding: 28px 0 8px;">
                                        <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="border-collapse: collapse;">
                                            <tr>
                                                <td align="center" bgcolor="#1677ff" style="background-color: #1677ff; mso-padding-alt: 12px 32px;">
                                                    <a href="{{ review_url }}" target="_blank" style="display: inline-block; padding: 12px 32px; color: #ffffff; background-color: #1677ff; font-size: 16px; line-height: 20px; font-weight: 700; text-decoration: none;">立即审核</a>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" bgcolor="#f8f9fa" style="padding: 20px 32px; background-color: #f8f9fa; border-top: 1px solid #e5e7eb; color: #8c8c8c; font-size: 12px; line-height: 20px;">
                            此邮件由系统自动发送，请勿直接回复。<br>
                            如有疑问，请联系 HR 部门。<br>
                            © {{ current_year }} AI 智能招聘管理系统
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
