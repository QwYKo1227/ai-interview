map $request_uri $loggable_request {
    default 1;
    ~^/api/public/ 0;
    ~^/public/coding-tests/ 0;
    ~^/public/review/ 0;
    ~^/offer-confirm/ 0;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # request_uri 保留内部重定向前的原始路径，避免 SPA fallback
    # 从 token location 跳回 "/" 后重新启用访问日志。
    access_log /var/log/nginx/access.log main if=$loggable_request;

    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 公开 API 的路径段包含一次性令牌；访问日志和上游错误日志均不得记录 URI。
    location ^~ /api/public/ {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 2s;
    }

    # 三类 SPA 入口同样在路径中携带令牌。
    location ^~ /public/coding-tests/ {
        access_log off;
        error_log /dev/null crit;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /public/review/ {
        access_log off;
        error_log /dev/null crit;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /offer-confirm/ {
        access_log off;
        error_log /dev/null crit;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    location /uploads {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
