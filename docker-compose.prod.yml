services:
  postgres:
    image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    container_name: ai_interview_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ai_interview}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:?Set APP_RUNTIME_PASSWORD in .env}
      APP_MIGRATION_PASSWORD: ${APP_MIGRATION_PASSWORD:?Set APP_MIGRATION_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init/01-app-roles.sh:/docker-entrypoint-initdb.d/01-app-roles.sh:ro
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-init:
    image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    environment:
      PGHOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ai_interview}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:?Set APP_RUNTIME_PASSWORD in .env}
      APP_MIGRATION_PASSWORD: ${APP_MIGRATION_PASSWORD:?Set APP_MIGRATION_PASSWORD in .env}
    volumes:
      - ./docker/postgres/init/01-app-roles.sh:/usr/local/bin/initialize-app-roles.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/initialize-app-roles.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend-migrate:
    build:
      context: ./backend
    image: ai-interview-backend:latest
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set the app_migration MIGRATION_DATABASE_URL in .env}
    volumes:
      - backend_uploads:/app/uploads
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    restart: "no"

  postgres-finalize:
    image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    environment:
      PGHOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ai_interview}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:?Set APP_RUNTIME_PASSWORD in .env}
      APP_MIGRATION_PASSWORD: ${APP_MIGRATION_PASSWORD:?Set APP_MIGRATION_PASSWORD in .env}
    volumes:
      - ./docker/postgres/init/01-app-roles.sh:/usr/local/bin/initialize-app-roles.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/initialize-app-roles.sh"]
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build:
      context: ./backend
    image: ai-interview-backend:latest
    container_name: ai_interview_backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the app_runtime DATABASE_URL in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env before starting production}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@example.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in .env before first production startup}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-System Admin}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ASR_PROVIDER: ${ASR_PROVIDER:-openai_compatible}
      ASR_BASE_URL: ${ASR_BASE_URL:-}
      ASR_MODEL: ${ASR_MODEL:-paraformer-offline}
      ASR_API_KEY: ${ASR_API_KEY:-}
      DOCUMENT_PARSER_URL: ${DOCUMENT_PARSER_URL:-http://10.10.60.20:10021}
      DOCUMENT_PARSER_VLM_SERVER_URL: ${DOCUMENT_PARSER_VLM_SERVER_URL:-http://127.0.0.1:10020}
      DOCUMENT_PARSER_TIMEOUT_SECONDS: ${DOCUMENT_PARSER_TIMEOUT_SECONDS:-180}
      DOCUMENT_PARSER_MAX_PAGES: ${DOCUMENT_PARSER_MAX_PAGES:-20}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-10}
      RATE_LIMIT_PUBLIC_UPLOAD: ${RATE_LIMIT_PUBLIC_UPLOAD:-10}
      RATE_LIMIT_PUBLIC_UPLOAD_TENANT: ${RATE_LIMIT_PUBLIC_UPLOAD_TENANT:-1000}
      RATE_LIMIT_PUBLIC_CODE_RUN: ${RATE_LIMIT_PUBLIC_CODE_RUN:-30}
      RATE_LIMIT_PUBLIC_CODE_SUBMIT: ${RATE_LIMIT_PUBLIC_CODE_SUBMIT:-10}
      RATE_LIMIT_PUBLIC_ESSAY_SUBMIT: ${RATE_LIMIT_PUBLIC_ESSAY_SUBMIT:-5}
      RATE_LIMIT_MAX_BUCKETS: ${RATE_LIMIT_MAX_BUCKETS:-10000}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      UNIFIED_ENTRY_HOSTS: ${UNIFIED_ENTRY_HOSTS:?Set UNIFIED_ENTRY_HOSTS to the shared company login hostname}
      APP_ENV: production
    volumes:
      - backend_uploads:/app/uploads
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    depends_on:
      postgres-finalize:
        condition: service_completed_successfully
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    image: ai-interview-frontend:latest
    container_name: ai_interview_frontend
    depends_on:
      - backend
    restart: always

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: ai_interview_caddy
    environment:
      APP_DOMAINS: "${APP_DOMAINS:-interview.careray.com, interview.photonthix.com}"
      ASR_REALTIME_UPSTREAM: "${ASR_REALTIME_UPSTREAM:-10.10.60.20:10096}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: always

volumes:
  postgres_data:
  backend_uploads:
  caddy_data:
  caddy_config:
